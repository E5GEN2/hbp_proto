# Dependabot — automated dependency-update PRs + security alerts.
# Security updates for known advisories are opened automatically (regardless of
# the schedule); the weekly cadence keeps everything else current.
version: 2
updates:
  # Application dependencies (pnpm / npm ecosystem).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - security
    groups:
      # Batch low-risk patch/minor bumps into one PR to cut noise; majors and
      # security fixes still come as their own PRs.
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Keep the GitHub Actions in these workflows patched too (supply-chain).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    labels:
      - ci
      - security
